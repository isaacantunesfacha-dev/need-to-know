name: Security Review

permissions:
  pull-requests: write  # PR review comments
  contents: read

on:
  pull_request:

jobs:
  security:
    # Fork PRs receive no secrets and a read-only token: skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      # Same audited commit SHA as gina-training-lab, never a mutable branch ref.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 2026-02-11
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          false-positive-filtering-instructions: .github/false-positive-filtering.txt
